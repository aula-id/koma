[[tool]]
name = "group_delegate"
handler = "group_delegate"
description = "Hand a goal to specialists by avatar id. One assignment per avatar per batch; reuse goal_key for later rounds of the same engagement."
[tool.schema]
type = "object"
required = ["goal_key", "goal", "dispatch_key", "assignments"]
additionalProperties = false
[tool.schema.properties]
goal_key = { type = "string", minLength = 1, maxLength = 128 }
goal = { type = "string", minLength = 1, maxLength = 20000 }
dispatch_key = { type = "string", minLength = 1, maxLength = 128 }
assignments = { type = "array", minItems = 1, maxItems = 32, items = { type = "object", required = ["avatar", "kind", "prompt"], properties = { avatar = { type = "string" }, kind = { type = "string", enum = ["probe", "investigation", "verification", "report"] }, prompt = { type = "string", minLength = 1, maxLength = 20000 }, reviews_id = { type = "string" }, retry_of = { type = "string" } } } }

[[tool]]
name = "group_status"
handler = "group_status"
description = "Current work, assignments, confirmation queue and open trajectory goals."
[tool.schema]
type = "object"
additionalProperties = false
[tool.schema.properties]

[[tool]]
name = "group_nudge"
handler = "group_nudge"
description = "Send a steering note to a running specialist, for example to make it publish unpublished findings."
[tool.schema]
type = "object"
required = ["avatar"]
additionalProperties = false
[tool.schema.properties]
avatar = { type = "string" }
note = { type = "string", maxLength = 2000 }

[[tool]]
name = "group_finish"
handler = "group_finish"
description = "Close the engagement with the final report. Refused until every gate passes."
[tool.schema]
type = "object"
required = ["report"]
additionalProperties = false
[tool.schema.properties]
report = { type = "string", minLength = 1, maxLength = 20000 }

[[tool]]
name = "message_user"
handler = "message_user"
description = "Send the user a short message now, without ending the turn."
[tool.schema]
type = "object"
required = ["text"]
additionalProperties = false
[tool.schema.properties]
text = { type = "string", minLength = 1, maxLength = 4000 }

