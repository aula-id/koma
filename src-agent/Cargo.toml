[package]
name = "agent"
version = "0.3.29"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
winresource = "0.1"

[dependencies]
ratatui = "0.30.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal", "process"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "native-tls-vendored"] }
dom_smoothie = "0.18.0"
fast_html2md = "0.0.62"
scraper = "0.27.0"
url = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.9"
anyhow = "1"
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "v5"] }
dirs = "5"
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
regex = "1"
globset = "0.4"
infer = "0.16"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
ed25519-dalek = "2"
koma-extension = { path = "../src-extension" }
portable-pty = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
sha2 = "0.10"
rmcp = { version = "1.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "macros"] }

# Linker daemon: import-graph scanner (tree-sitter based).
tree-sitter = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-dart = { version = "0.0.4", optional = true }
tree-sitter-swift = { version = "0.6", optional = true }
notify = { version = "8", optional = true }
notify-debouncer-mini = { version = "0.7", optional = true }

# --- feature = "gui": xterm.js + wry desktop client. All optional; the default
# build pulls NONE of these (headless-safe, lean `cargo install`). ---
# `devtools` keeps WebView inspector available in release builds too (debug
# builds always get it). Needed so F12 / Inspect can call open_devtools().
wry = { version = "0.52", optional = true, features = ["transparent", "devtools"] }
tao = { version = "0.35", optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
arboard = { version = "3", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSColor",
] }
muda = { version = "0.19", optional = true, default-features = false }

[features]
default = ["gui", "linker"]
gui = ["dep:wry", "dep:tao", "dep:objc2-app-kit", "dep:rfd", "dep:muda"]
linker = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-php",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-dart",
    "dep:tree-sitter-swift",
    "dep:notify",
    "dep:notify-debouncer-mini",
]

[[bin]]
name = "koma"
path = "src/main.rs"

[package.metadata.packager]
product-name = "koma"
identifier = "run.koma.app"
category = "DeveloperTool"
icons = ["../assets/icon.ico", "../assets/icon.icns", "../assets/icon*.png"]

[package.metadata.packager.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0"]
section = "utils"
desktop-template = "../packaging/linux/koma.desktop.hbs"

[package.metadata.packager.wix]
template = "../packaging/windows/main.wxs"
fragment-paths = ["../packaging/windows/path-and-shortcut.wxs"]
component-group-refs = ["KomaPathAndShortcut"]
