[package]
name = "agent"
version = "0.2.26"
edition = "2021"
license = "Apache-2.0"

[dependencies]
ratatui = "0.30.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "native-tls-vendored"] }
dom_smoothie = "0.18.0"
fast_html2md = "0.0.62"
scraper = "0.27.0"
url = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.9"
anyhow = "1"
include_dir = "0.7"
uuid = { version = "1", features = ["v4", "v5"] }
dirs = "5"
futures-util = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
regex = "1"
globset = "0.4"
infer = "0.16"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
# MCP (Model Context Protocol) CLIENT. Client + stdio child-process transport +
# streamable-HTTP client transport. tokio-native; reuses the existing tokio runtime.
rmcp = { version = "1.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "macros"] }
eframe = { version = "0.34", optional = true }
egui = { version = "0.34", optional = true }
egui_ratatui = { version = "2.2", optional = true }
# egui_ratatui pulls soft_ratatui with default-features = false, so it ships NO fonts. We
# depend on it directly, with the `embedded-ttf` feature (TrueType via RustType) so `koma gui`
# renders with the bundled Nerd Font (assets/fonts) instead of the built-in bitmap atlas —
# needed for Nerd-Font private-use icons + crisp scaling. Names SoftBackend/EmbeddedTTF.
soft_ratatui = { version = "0.2", optional = true, features = ["embedded-ttf"] }

[features]
gui = ["dep:eframe", "dep:egui", "dep:egui_ratatui", "dep:soft_ratatui"]

[[bin]]
name = "koma"
path = "src/main.rs"
