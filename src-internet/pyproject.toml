[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapion-agent"
version = "0.1.0"
description = "Web scraping automation with Playwright — browser page fetch, search, and screenshot"
requires-python = ">=3.8"
dependencies = [
    "playwright>=1.40.0",
    "fake-useragent>=1.4.0",
    "markdownify>=0.11.0",
]

[tool.setuptools.packages.find]
include = ["scrapion_agent*"]
