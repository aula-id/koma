name: release

# Build the koma binary for every supported platform on a version-tag push and
# attach each one to the GitHub release. Asset names MUST match install.sh:
#   koma-linux-x64, koma-linux-arm64, koma-darwin-arm64, koma-darwin-x64
#
# Linux raw binaries stay TUI-only (no `gui` feature) so they never hard-link
# webkitgtk at load time and keep working on GTK-less servers. Darwin raw
# binaries are built `--features gui` (wry uses the always-present system
# WebKit), so `koma gui` works straight from the released binary. The raw
# koma-windows-x64.exe (built in windows-package below) is likewise
# default-features/TUI-only, mirroring the Linux raw-asset philosophy.
#
# The linux-packages / windows-package jobs additionally publish desktop
# installers under STABLE, VERSIONLESS names (hard-linked from the homepage via
# /releases/latest/download/): koma-x64.deb, koma-arm64.deb, koma-x64.AppImage,
# koma-arm64.AppImage, koma-x64.msi (this one IS gui-featured), plus the raw
# koma-windows-x64.exe. These are NOT referenced by install.sh.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Linux (TUI-only: no gui feature, no Node) -----
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: koma-linux-x64
            cross: false
            features: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: koma-linux-arm64
            cross: true
            features: ""
          # ----- macOS (Apple Silicon runner; x86_64 cross-compiles natively) -----
          # gui-featured: wry uses the system WebKit, so `koma gui` works.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: koma-darwin-arm64
            cross: false
            features: "--features gui"
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: koma-darwin-x64
            cross: false
            features: "--features gui"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The aarch64 Linux target needs a cross linker on the x86_64 runner.
      - name: Install aarch64 cross linker (Linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      # The gui feature's build.rs runs `npm install && npm run build` in
      # src-webgui, so Node must be on PATH before `cargo build`. Only the
      # darwin assets carry `--features gui`, so this step is skipped for the
      # TUI-only Linux binaries (keeping them Node-free and webkitgtk-free).
      - name: Install Node (gui builds)
        if: contains(matrix.features, 'gui')
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build release binary
        run: cargo build --release -p agent --target ${{ matrix.target }} ${{ matrix.features }}

      # The bin is named "koma" (see src-agent/Cargo.toml [[bin]]); rename to the
      # per-platform asset name so install.sh can fetch it directly.
      - name: Stage asset
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/koma" "${{ matrix.asset }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  # ---------------------------------------------------------------------------
  # Linux desktop installers (.deb + .AppImage). Built NATIVELY per arch because
  # the AppImage tooling (linuxdeploy/appimagetool) cannot cross-compile. Output
  # names embed the version (e.g. koma_0.2.27_amd64.deb), so a rename step maps
  # them to the stable versionless homepage names.
  #
  # NOTE: `ubuntu-24.04-arm` is a GitHub-hosted arm64 runner. It is free for
  # PUBLIC repos (this repo is public); private repos would need a paid larger-
  # runner plan for the arm label.
  # ---------------------------------------------------------------------------
  linux-packages:
    name: package linux ${{ matrix.arch }} (deb + appimage)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # webkit2gtk + gtk dev headers for the wry (gui) build and for
      # cargo-packager's AppImage bundling. libwebkit2gtk-4.1-dev already
      # depends on libgtk-3-dev AND libsoup-3.0-dev (verified on
      # packages.ubuntu.com/noble), so libsoup is not listed explicitly.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-packages-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Pinned to the latest published cargo-packager (0.11.8) with --locked so
      # the tool builds from its own committed lockfile (reproducible).
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build release binary (gui)
        run: cargo build --release -p agent --features gui

      # cargo-packager reads [package.metadata.packager] from src-agent/Cargo.toml
      # via `cargo metadata`, auto-detects the single `koma` bin, locates it at
      # target/release/koma, and writes packages to target/release/. No
      # --out-dir/--binaries flags are needed (verified against cargo-packager
      # crates/packager/src/cli/config.rs::load_configs_from_cargo_workspace).
      # APPIMAGE_EXTRACT_AND_RUN=1: linuxdeploy/appimagetool are themselves
      # AppImages and GitHub runners may lack FUSE.
      - name: Package deb + appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo packager --release --formats deb,appimage --verbose

      # Map the version-embedded outputs (koma_<ver>_<arch>.deb /
      # koma_<ver>_<arch>.AppImage, written directly into target/release/) to the
      # stable versionless names the homepage hard-links from
      # /releases/latest/download/. -maxdepth 1 + the koma* prefix excludes the
      # intermediate files under target/release/.cargo-packager/.
      - name: Rename package assets
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find target/release -maxdepth 1 -name 'koma*.deb' -print -quit)
          appimage=$(find target/release -maxdepth 1 -name 'koma*.AppImage' -print -quit)
          [ -n "$deb" ] || { echo "::error::no koma*.deb produced under target/release"; exit 1; }
          [ -n "$appimage" ] || { echo "::error::no koma*.AppImage produced under target/release"; exit 1; }
          echo "deb      $deb  ->  koma-${{ matrix.arch }}.deb"
          echo "appimage $appimage  ->  koma-${{ matrix.arch }}.AppImage"
          cp "$deb" "koma-${{ matrix.arch }}.deb"
          cp "$appimage" "koma-${{ matrix.arch }}.AppImage"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            koma-${{ matrix.arch }}.deb
            koma-${{ matrix.arch }}.AppImage

  # ---------------------------------------------------------------------------
  # Windows: raw koma-windows-x64.exe + the .msi installer (WiX). cargo-packager
  # downloads the WiX toolset itself, so no separate WiX install step is needed.
  # Rename/glob steps use `shell: bash` (Git Bash ships on the windows runner) to
  # avoid mixing PowerShell and bash dialects.
  #
  # The raw exe is built default-features (TUI-only), mirroring the
  # koma-linux-* raw assets philosophy — it must never carry `gui`, so it's
  # built and staged out FIRST, before the gui-featured build below can
  # overwrite target/release/koma.exe. The .msi stays the gui-featured
  # product build.
  # ---------------------------------------------------------------------------
  windows-package:
    name: package windows x64 (msi + exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-packages-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Lean default-features build first (TUI-only, no gui feature). Staged
      # out immediately so the gui build below can't contaminate it.
      - name: Build release binary (default features)
        run: cargo build --release -p agent

      # Raw unpackaged binary, published alongside the installer.
      - name: Stage raw exe
        shell: bash
        run: cp target/release/koma.exe koma-windows-x64.exe

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # gui-featured build for the .msi installer; this overwrites
      # target/release/koma.exe, but the raw exe was already copied out above.
      - name: Build release binary (gui)
        run: cargo build --release -p agent --features gui

      - name: Package msi (wix)
        run: cargo packager --release --formats wix --verbose

      # cargo-packager emits e.g. koma_0.2.27_x64_en-US.msi directly into
      # target/release/; map it to the stable versionless homepage name.
      # -maxdepth 1 + the koma* prefix excludes the intermediate
      # target/release/.cargo-packager/wix/<arch>/output.msi.
      - name: Rename msi asset
        shell: bash
        run: |
          set -euo pipefail
          msi=$(find target/release -maxdepth 1 -name 'koma*.msi' -print -quit)
          [ -n "$msi" ] || { echo "::error::no koma*.msi produced under target/release"; exit 1; }
          echo "msi $msi  ->  koma-x64.msi"
          cp "$msi" koma-x64.msi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            koma-windows-x64.exe
            koma-x64.msi
