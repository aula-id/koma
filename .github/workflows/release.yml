name: release

# Build koma on a version-tag push and attach the packages to the GitHub release.
# Linux/macOS binary asset names MUST match install.sh:
#   koma-linux-x64, koma-linux-arm64, koma-darwin-arm64, koma-darwin-x64
#
# All builds ship the GUI feature by default (default = ["gui"] in Cargo.toml),
# so `koma gui` works out of the box on every platform. Linux raw binaries
# link against system webkit2gtk (not bundled); Darwin uses the system WebKit;
# Windows uses WebView2.
#
# The windows-package job additionally publishes the desktop installer under the
# stable, versionless name hard-linked from the homepage
# (/releases/latest/download/koma-x64.msi). install.ps1 downloads that WiX MSI.
# Linux deb and AppImage packages are not built.
#
# IMPORTANT: Linux runners are pinned to ubuntu-22.04 (glibc 2.35) so that
# prebuilt binaries run on Ubuntu 22.04 LTS and all newer releases. Glibc is
# backward-compatible: a binary linked against 2.35 runs on 2.35+ but NOT on
# older systems. Building on ubuntu-latest (24.04 / glibc 2.39) would produce
# binaries that crash with "GLIBC_2.38/2.39 not found" on Jammy.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Linux (pinned to 22.04 for glibc 2.35 baseline) -----
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: koma-linux-x64
            cross: false
            buildflags: ""
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            asset: koma-linux-arm64
            cross: true
            buildflags: "--no-default-features"
          # ----- macOS (Apple Silicon runner; x86_64 cross-compiles natively) -----
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: koma-darwin-arm64
            cross: false
            buildflags: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: koma-darwin-x64
            cross: false
            buildflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The aarch64 Linux target needs a cross linker on the x86_64 runner.
      - name: Install aarch64 cross linker (Linux arm64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      # The gui feature's build.rs runs `npm install && npm run build` in
      # src-webgui, so Node must be on PATH before `cargo build`.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build release binary
        run: cargo build --release -p agent --target ${{ matrix.target }} ${{ matrix.buildflags }}

      # The bin is named "koma" (see src-agent/Cargo.toml [[bin]]); rename to the
      # per-platform asset name so install.sh can fetch it directly.
      - name: Stage asset
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/koma" "${{ matrix.asset }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  # ---------------------------------------------------------------------------
  # Windows: the .msi installer (WiX), including the GUI (default = ["gui"]).
  # cargo-packager downloads the WiX toolset
  # itself, so no separate WiX install step is needed. Rename/glob steps use
  # `shell: bash` (Git Bash ships on the windows runner) to avoid mixing
  # PowerShell and bash dialects.
  # ---------------------------------------------------------------------------
  windows-package:
    name: package windows x64 (msi)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-packages-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # Build the GUI-enabled executable that WiX embeds in the MSI.
      - name: Build release binary
        run: cargo build --release -p agent

      # cargo-packager reads [package.metadata.packager] from src-agent/Cargo.toml
      # via `cargo metadata`, auto-detects the single `koma` bin, locates it at
      # target/release/koma.exe, and writes packages to target/release/. No
      # --out-dir/--binaries flags are needed (verified against cargo-packager
      # crates/packager/src/cli/config.rs::load_configs_from_cargo_workspace).
      - name: Prepare bundled Windows OCR
        shell: pwsh
        run: ./scripts/prepare_windows_ocr.ps1

      - name: Prepare bundled Windows shell
        shell: pwsh
        run: ./scripts/prepare_windows_shell.ps1

      - name: Package msi (wix)
        run: cargo packager --release --formats wix --verbose

      - name: Verify packaged Windows OCR
        shell: pwsh
        run: ./scripts/check_windows_ocr.ps1

      - name: Verify packaged Windows shell
        shell: pwsh
        run: ./scripts/check_windows_shell.ps1

      # cargo-packager emits e.g. koma_0.2.27_x64_en-US.msi directly into
      # target/release/; map it to the stable versionless homepage name.
      # -maxdepth 1 + the koma* prefix excludes the intermediate
      # target/release/.cargo-packager/wix/<arch>/output.msi.
      - name: Rename msi asset
        shell: bash
        run: |
          set -euo pipefail
          msi=$(find target/release -maxdepth 1 -name 'koma*.msi' -print -quit)
          [ -n "$msi" ] || { echo "::error::no koma*.msi produced under target/release"; exit 1; }
          echo "msi $msi  ->  koma-x64.msi"
          cp "$msi" koma-x64.msi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            koma-x64.msi
