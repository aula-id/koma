name: ci

# Runs the test suite across every OS/arch koma ships for, plus non-gating
# formatting and lint checks and a Nix eval (no package build), on pull
# requests only.
# Pushes to main and release/tag workflows do not trigger these checks.
# Uses only standard GitHub-hosted runners, which are free and unmetered for
# public repositories, so this does not touch the Actions minute allotment used
# by the release workflow.
#
# Staged so one pull request does not start every job at once:
#   1. lint and nix, together, on ubuntu
#   2. sdk, test, and terminal, after those pass
#      (the test and terminal matrices take two runners at a time)
#   3. macOS GUI release link, after the test and terminal matrices pass
# A clippy or flake failure skips the later stages. rustfmt stays non-gating.
on:
  pull_request:

# Cancel superseded runs on the same ref so we never pay for stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sdk:
    name: SDK (${{ matrix.os }})
    needs: [lint, nix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python SDK tests
        env:
          PYTHONPATH: src-core-sdk/python/src
        run: python -m unittest discover -s src-core-sdk/python/tests -v
      - name: Install fixture validator
        run: python -m pip install jsonschema
      - name: Fixture conformance
        run: python src-core-sdk/conformance/test_fake_adapter.py
      - name: Install TypeScript build dependencies
        working-directory: src-core-sdk/typescript
        run: npm ci
      - name: TypeScript SDK build and tests
        working-directory: src-core-sdk/typescript
        env:
          PYTHON: python
        run: npm test

  test:
    name: test (${{ matrix.name }})
    needs: [lint, nix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64 (darwin)
            os: macos-latest
          - name: macos-x64 (intel)
            os: macos-26-intel
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0.0.4-cache-rust"

      # After the cache: rust-cache empties target/ on a partial key match.
      - name: Prepare offline terminal
        run: python scripts/prepare-terminal.py

      - name: Validate payload preparation gates
        run: python -m unittest discover -s scripts -p test_terminal_payload.py

      - name: Filesystem recovery regressions (native Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-default-features --bin koma tool::recovery

      - name: Tests (agent)
        run: cargo test --workspace --no-default-features --all-targets

      - name: First-run setup exit over native IPC
        run: |
          cargo build -p agent --no-default-features
          python src-term/scripts/verify-setup-exit.py

      - name: Native Windows SSH password helper
        if: runner.os == 'Windows'
        run: ./target/debug/koma.exe --ssh-askpass-self-test

      # Python daemon transport tests on Windows — validates the TCP transport
      # path that replaces Unix sockets. Only on Windows where the TCP path is
      # the primary transport.
      - name: Tests (Python daemon, Windows)
        if: runner.os == 'Windows'
        working-directory: src-internet
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pytest-asyncio
          python -m pytest tests/test_daemon.py tests/test_protocol.py -v

      # src-extension is a separate workspace (serde-only, no GUI/OS deps).
      - name: Tests (src-extension)
        working-directory: src-extension
        run: cargo test --workspace --all-targets

  # The OpenTUI client is TypeScript plus a native library. Cargo embeds the
  # complete payload; this job tests frozen dependencies on every release OS. linux-arm64 is native here (the release job cross-builds it).
  term:
    name: terminal (${{ matrix.name }})
    needs: [lint, nix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64 (darwin)
            os: macos-latest
          - name: macos-x64 (intel)
            os: macos-26-intel
          - name: windows-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Prepare offline terminal
        run: python scripts/prepare-terminal.py

      - name: Cache terminal dependencies
        uses: actions/cache@v4
        with:
          path: src-term/node_modules
          key: term-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-term/bun.lock') }}

      - name: Install terminal dependencies
        working-directory: src-term
        run: bun install --frozen-lockfile

      - name: Test terminal client
        working-directory: src-term
        run: bun test

      - name: Type check terminal client
        working-directory: src-term
        run: bun node_modules/typescript/bin/tsc --noEmit

  macos-gui-link:
    name: GUI release link (${{ matrix.target }})
    needs: [test, term]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon is the primary Darwin build; retain native Intel coverage.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-gui-link-v1
          key: ${{ matrix.target }}

      # After the cache: rust-cache empties target/ on a partial key match.
      - name: Prepare offline terminal
        run: python scripts/prepare-terminal.py

      # cargo check and the headless test matrix cannot detect missing GUI FFI
      # archives/frameworks. Link the real executable without opening a desktop.
      - name: Link GUI release executable
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo build --locked --release -p agent --bin koma --target ${{ matrix.target }}

      # Only the failing Intel release compiler needs the stack workaround.
      - name: Link Intel macOS GUI release executable
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          RUST_MIN_STACK: "33554432"
        run: cargo build --locked --release -p agent --bin koma --target ${{ matrix.target }}

  nix:
    name: nix (eval, no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Fail fast with a one-line fix when package-lock.json moved but
      # src-webgui/npm-deps-hash did not. Avoids a long FOD mismatch log.
      - name: webgui npm-deps hash in sync with package-lock
        run: ./scripts/update-webgui-npm-deps.sh --check

      # checks.default / checks.gui are the full packages. Instantiate them for
      # every Linux system, but do not build: the compile is what made this job
      # long, and the test matrix already builds the agent.
      - name: evaluate flake
        run: nix flake check --no-build --all-systems

  lint:
    name: fmt (non-gating) + clippy (prod, gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0.0.4-cache-rust-lint"

      # After the cache: rust-cache empties target/ on a partial key match.
      - name: Prepare offline terminal
        run: python scripts/prepare-terminal.py

      # Formatting: non-gating until the tree is rustfmt-clean.
      - name: Formatting
        run: cargo fmt --all --check || true

      - name: Formatting (src-extension)
        working-directory: src-extension
        run: cargo fmt --all --check || true

      # Check production separately so cfg(not(test)) enforces the ban on
      # unwrap/expect in application code.
      - name: Clippy (production)
        run: cargo clippy --workspace --no-default-features --lib --bins -- -D warnings

      # Test, bench, and example sources must also remain warning-free.
      - name: Clippy (all targets)
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: Clippy (src-extension, production)
        working-directory: src-extension
        run: cargo clippy --workspace --lib --bins -- -D warnings
