name: nix

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            system: x86_64-linux
            os: ubuntu-latest
          - name: linux-arm64
            system: aarch64-linux
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # checks.default / checks.gui are the packages themselves (see flake.nix),
      # so this already builds and validates both without a separate build step.
      - name: nix flake check
        run: nix flake check --print-build-logs
